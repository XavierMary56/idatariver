services:
  db:
    image: postgres:16
    env_file: [.env]
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 20
    ports:
      - "5432:5432"   # 可选：方便你本机连接

  migrate:
    build:
      context: .
      target: migrate
    env_file: [.env]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      target: api
    env_file: [.env]
    ports:
      - "${API_PORT}:8080"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  api-dev:
    image: golang:1.23
    profiles: ["dev"]
    working_dir: /app
    volumes:
      - .:/app
    env_file: [.env]
    ports:
      - "${API_PORT}:8080"
    depends_on:
      db:
        condition: service_healthy
    command: ["go", "run", "./cmd/api"]

  worker:
    build:
      context: .
      target: worker
    env_file: [.env]
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  worker-dev:
    image: golang:1.23
    profiles: ["dev"]
    working_dir: /app
    volumes:
      - .:/app
    env_file: [.env]
    depends_on:
      db:
        condition: service_healthy
    command: ["go", "run", "./cmd/worker"]